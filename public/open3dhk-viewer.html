<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Streetscape 360</title>
  <style>
    html,body,#panorama,#boxes { width:100%;height:100%;margin:0;overflow:hidden; }
    body { background:#222; }
    #panorama { position:absolute;inset:0; }
    #boxes { position:absolute;inset:0;pointer-events:none; }
    #credit { position:absolute;right:6px;bottom:4px;font:11px Arial,sans-serif;color:white;background:#222b;padding:3px 5px;pointer-events:none; }
    polygon { pointer-events:auto;cursor:pointer; }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <svg id="boxes" aria-label="Saved fragments"></svg>
  <div id="credit">© Lands Department · Streetscape 360</div>
  <script type="module" src="/open3dhk-viewer.js"></script>
</body>
</html>
